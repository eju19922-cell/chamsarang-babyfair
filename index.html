<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참사랑 베이비페어 상담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════
   팔레트 — 브랜드 핑크는 유지, 글씨는 전부 진한 핑크로.
   (검토의견서: 파스텔 글씨는 노트북에서 안 읽힘 → #C2185B 계열)
   본문 대비 15:1 / 강조 6.4:1 이상으로 잡음.
   ═══════════════════════════════════════════════════════════ */
:root{
  --ground:#FAF6F7;
  --surface:#FFFFFF;
  --surface-2:#FDF1F6;      /* 파스텔 핑크 — 면(배경)에만 사용 */
  --line:#EFDCE4;
  --line-2:#E3C6D3;
  --ink:#231A1E;            /* 본문 15.4:1 */
  --text-2:#5E4A52;         /* 보조 8.1:1 */
  --text-3:#8A7079;         /* 약한 텍스트 4.6:1 */
  --brand:#C2185B;          /* 강조 글씨 6.4:1 */
  --brand-d:#98123F;        /* 더 진한 강조 9.2:1 */
  --brand-soft:#FDF1F6;
  --brand-line:#EDBCD3;
  --gold:#8A6212;           /* 골드 대체 — 원래 #D9A54A는 2:1 */
  --good:#0F6B3C;
  --good-soft:#E4F3EA;
  --good-line:#A9D6BC;
  --warn:#8A4B02;
  --warn-soft:#FCF0DE;
  --warn-line:#E8C79A;
  --crit:#A31D1D;
  --crit-soft:#FBE8E8;
  --crit-line:#EDB5B5;
  --shadow:0 1px 2px rgba(60,20,40,.05), 0 12px 32px -18px rgba(60,20,40,.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.serif{font-family:"Gowun Batang","Batang",serif;}

/* ── 전체 틀 ── */
.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh;}
@media (max-width:1000px){.app{grid-template-columns:1fr;}}

/* ── 왼쪽 진행 목록 ── */
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
@media (max-width:1000px){.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);}}

/* 상담 중에는 화면 전체가 상담 내용 — 목록은 필요할 때만 */
body.presenting .app{grid-template-columns:minmax(0,1fr);}
body.presenting .rail{display:none;}
body.presenting.menu .rail{
  display:flex;position:fixed;left:0;top:0;bottom:0;width:280px;height:100vh;z-index:82;
  box-shadow:0 0 40px -8px rgba(60,20,40,.3);
}
.railveil{position:fixed;inset:0;background:rgba(35,26,30,.42);z-index:81;display:none;}
body.presenting.menu .railveil{display:block;}
@media (prefers-reduced-motion:reduce){body.presenting .rail{transition:none;}}
.rail-h{padding:20px 20px 14px;border-bottom:1px solid var(--line);}
.rail-h .logo{font-family:"Gowun Batang",serif;font-weight:700;font-size:21px;color:var(--brand-d);letter-spacing:-.02em;}
.rail-h .tag{font-size:13px;color:var(--text-3);margin-top:2px;}
.prog{height:5px;background:var(--surface-2);border-radius:99px;margin-top:12px;overflow:hidden;}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s;}
.prog-t{font-size:12px;color:var(--text-3);margin-top:6px;}

/* 상담 코스 선택 */
.courses{display:grid;gap:6px;margin-top:14px;}
.crs{
  display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  font-family:inherit;cursor:pointer;padding:9px 12px;border-radius:9px;
  background:var(--surface);border:1.5px solid var(--line-2);color:var(--text-2);transition:.13s;
}
.crs:hover{border-color:var(--brand);background:var(--brand-soft);}
.crs.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.crs b{font-size:14.5px;font-weight:600;}
.crs span{font-size:12.5px;color:var(--text-3);margin-left:auto;}
.crs.on span{color:rgba(255,255,255,.82);}
.crs:focus-visible{outline:3px solid var(--brand-line);outline-offset:2px;}

.steps{flex:1;overflow-y:auto;padding:10px 10px 16px;}
.snav{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:none;border:0;font-family:inherit;cursor:pointer;
  padding:9px 11px;border-radius:9px;color:var(--text-2);transition:.13s;
}
.snav:hover{background:var(--surface-2);color:var(--brand-d);}
.snav.on{background:var(--brand);color:#fff;}
.snav.done .sn{background:var(--good);color:#fff;border-color:var(--good);}
.snav.on .sn{background:rgba(255,255,255,.22);color:#fff;border-color:transparent;}
.sn{
  flex:0 0 24px;width:24px;height:24px;border-radius:7px;
  border:1.5px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;font-size:12px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;color:var(--text-3);transition:.13s;
}
.st{font-size:14.5px;font-weight:500;line-height:1.4;padding-top:1px;}
.snav.on .st{font-weight:600;}
.sgroup{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--text-3);
  padding:14px 12px 5px;text-transform:uppercase;}

.rail-f{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}

/* ── 버튼 ── */
.btn{
  font-family:inherit;font-size:14.5px;font-weight:500;cursor:pointer;
  background:var(--surface);color:var(--text-2);
  border:1.5px solid var(--line-2);border-radius:10px;padding:10px 16px;transition:.14s;
}
.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);}
.btn:focus-visible{outline:3px solid var(--brand-line);outline-offset:2px;}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff;}
.btn.lg{font-size:16px;padding:13px 24px;}

/* ── 무대 — 한 화면에 딱 맞게 ── */
.stage{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.slide{
  flex:1;min-height:0;padding:30px 46px 18px;width:100%;
  display:flex;justify-content:center;align-items:flex-start;overflow:hidden;
}
.slide.scrolls{overflow-y:auto;align-items:flex-start;}
@media (max-width:760px){.slide{padding:20px 18px 14px;}}
.fitbox{width:100%;max-width:1120px;transform-origin:top center;transition:transform .18s;}
.slide-anim{animation:slideIn .26s ease-out;}
@keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.slide-anim{animation:none;}}

/* ── 상담자 서랍 (대본 · 체크리스트) ── */
.drawer{
  flex:0 0 auto;background:#231A1E;border-top:2px solid #3D2D34;
  max-height:0;overflow:hidden;transition:max-height .25s;
}
.drawer.open{max-height:48vh;overflow-y:auto;}
.drawer-in{padding:20px 46px 26px;max-width:1120px;margin:0 auto;}
@media (max-width:760px){.drawer-in{padding:16px 18px 22px;}}
.drawer .script{margin-bottom:16px;border:0;padding:0;background:none;}
.drawer .chk{background:#2D2126;border-color:#3D2D34;box-shadow:none;margin-bottom:0;}
.drawer .chk h4{color:#F2A8C6;}
.drawer .chk h4 .cnt{background:rgba(242,168,198,.16);border-color:rgba(242,168,198,.35);color:#FFD3E4;}
.drawer .chk label{color:#E8DCE1;border-bottom-color:#3D2D34;}
.drawer .chk input:checked + span{color:#8A7079;}

/* 전체화면 시작 커버 */
.cover{
  position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#FFF 0%,#FDF1F6 100%);
  display:grid;place-items:center;text-align:center;padding:30px;
}
.cover.hide{display:none;}
.cover .cv{max-width:640px;}
.cover .lg{font-family:"Gowun Batang",serif;font-size:44px;font-weight:700;color:var(--brand-d);
  letter-spacing:-.025em;line-height:1.25;}
@media (max-width:640px){.cover .lg{font-size:32px;}}
.cover .sb{font-size:19px;color:var(--text-2);margin-top:12px;line-height:1.6;}
.cover .go{margin-top:30px;font-size:20px;padding:17px 44px;}
.cover .hint{margin-top:18px;font-size:14px;color:var(--text-3);line-height:1.7;}
.cover .hint .kbd{margin:0 2px;}
.eyebrow{
  font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--brand);
  text-transform:uppercase;margin-bottom:9px;
}
h1.title{
  font-family:"Gowun Batang",serif;font-weight:700;
  font-size:40px;line-height:1.25;margin:0 0 10px;letter-spacing:-.025em;
  text-wrap:balance;color:var(--ink);
}
@media (max-width:760px){h1.title{font-size:30px;}}
p.lede{font-size:19px;color:var(--text-2);margin:0 0 26px;max-width:62ch;line-height:1.6;}
p.lede b{color:var(--brand-d);font-weight:600;}

.cards{display:grid;gap:16px;margin-bottom:22px;}
.c2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.c4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.box{
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:20px 22px;box-shadow:var(--shadow);
}
.box.relief{border-color:var(--brand);border-width:2px;}
.box.relief h3{color:var(--brand);}
.box.soft{background:var(--surface-2);border-color:var(--brand-line);box-shadow:none;}
.box h3{font-size:18px;font-weight:600;margin:0 0 9px;color:var(--brand-d);letter-spacing:-.01em;}
.box p{margin:0 0 8px;font-size:16px;color:var(--text-2);line-height:1.65;}
.box p:last-child{margin-bottom:0;}
.box ul{margin:0;padding-left:19px;font-size:16px;color:var(--text-2);line-height:1.75;}
.box li{margin-bottom:5px;}
.box li b,.box p b{color:var(--ink);font-weight:600;}

/* 숫자 강조 */
.stat{text-align:center;padding:22px 16px;}
.stat .v{font-size:38px;font-weight:700;color:var(--brand);line-height:1.1;letter-spacing:-.03em;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
.stat .k{font-size:15px;color:var(--text-2);margin-top:6px;font-weight:500;}
.stat .why{font-size:13.5px;color:var(--text-3);margin-top:5px;line-height:1.5;}
.stat.hero{background:var(--brand);border-color:var(--brand);}
.stat.hero .v,.stat.hero .k{color:#fff;}
.stat.hero .why{color:rgba(255,255,255,.88);}

/* 핵심 한 줄 */
.punch{
  background:var(--brand-soft);border:2px solid var(--brand-line);border-left:6px solid var(--brand);
  border-radius:12px;padding:18px 22px;margin-bottom:22px;
}
.punch .lab{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--brand);margin-bottom:5px;}
.punch .txt{font-size:20px;font-weight:600;color:var(--brand-d);line-height:1.5;letter-spacing:-.015em;}
@media (max-width:760px){.punch .txt{font-size:17.5px;}}

/* 주의 / 확인필요 */
.note{border-radius:12px;padding:15px 19px;margin-bottom:18px;font-size:16px;line-height:1.6;
  display:flex;gap:12px;align-items:flex-start;}
.note .ic{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;flex:0 0 auto;}
.note.w{background:var(--warn-soft);border:1.5px solid var(--warn-line);color:var(--warn);}
.note.c{background:var(--crit-soft);border:1.5px solid var(--crit-line);color:var(--crit);}
.note.g{background:var(--good-soft);border:1.5px solid var(--good-line);color:var(--good);}
.note b{font-weight:600;}
.tbd{
  display:inline-block;font-size:12.5px;font-weight:600;vertical-align:2px;
  background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);
  border-radius:99px;padding:1px 9px;margin-left:6px;white-space:nowrap;
}

/* 타임라인 */
.tl{display:grid;gap:0;margin-bottom:22px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
.tl-row{display:grid;grid-template-columns:118px 1fr;gap:0;border-bottom:1px solid var(--line);}
.tl-row:last-child{border-bottom:0;}
.tl-t{background:var(--surface-2);padding:15px 16px;font-family:"IBM Plex Mono",monospace;
  font-weight:600;font-size:15px;color:var(--brand-d);border-right:1px solid var(--line);}
.tl-b{padding:14px 18px;}
.tl-b .tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;
  padding:1px 9px;margin-right:7px;margin-bottom:4px;}
.tag.m{background:#FBE4EE;color:var(--brand-d);}
.tag.b{background:#E2EEFA;color:#0E4E86;}
.tag.h{background:var(--good-soft);color:var(--good);}
.tl-b .txt{font-size:15.5px;color:var(--text-2);line-height:1.6;}
@media (max-width:620px){.tl-row{grid-template-columns:1fr;}.tl-t{border-right:0;border-bottom:1px solid var(--line);}}

/* 절차 */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-bottom:22px;}
.fstep{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:17px 18px;position:relative;}
.fstep .n{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;margin-bottom:9px;}
.fstep h4{margin:0 0 5px;font-size:16px;font-weight:600;color:var(--ink);}
.fstep p{margin:0;font-size:14.5px;color:var(--text-2);line-height:1.55;}

/* 상담자 대본 패널 */
.script{
  background:#231A1E;color:#F4E9EE;border-radius:14px;padding:22px 26px;margin-bottom:22px;
  border:1.5px solid #3D2D34;
}
.script h4{margin:0 0 12px;font-size:14px;font-weight:600;letter-spacing:.06em;
  color:#F2A8C6;text-transform:uppercase;display:flex;align-items:center;gap:9px;}
.script h4::before{content:"";width:4px;height:14px;background:#F2A8C6;border-radius:2px;}
.script .say{font-size:17px;line-height:1.75;margin:0 0 13px;color:#FBF3F6;}
.script .say:last-child{margin-bottom:0;}
.script .say::before{content:"“";color:#F2A8C6;font-weight:700;}
.script .say::after{content:"”";color:#F2A8C6;font-weight:700;}
.script .tip{
  margin-top:15px;padding:13px 16px;background:rgba(242,168,198,.12);
  border-radius:10px;font-size:15px;line-height:1.6;color:#F7DDE7;border:1px solid rgba(242,168,198,.28);
}
.script .tip b{color:#FFD3E4;font-weight:600;}

/* 체크리스트 */
.chk{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:18px 22px;margin-bottom:22px;box-shadow:var(--shadow);}
.chk h4{margin:0 0 11px;font-size:14.5px;font-weight:600;color:var(--text-2);
  display:flex;align-items:center;gap:8px;}
.chk h4 .cnt{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--brand);
  background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:99px;padding:1px 9px;}
.chk label{display:flex;gap:11px;align-items:flex-start;padding:8px 0;cursor:pointer;
  border-bottom:1px dashed var(--line);font-size:16px;color:var(--text-2);line-height:1.55;}
.chk label:last-child{border-bottom:0;}
.chk input{margin-top:4px;width:19px;height:19px;flex:0 0 19px;accent-color:var(--brand);cursor:pointer;}
.chk input:checked + span{color:var(--text-3);text-decoration:line-through;}

/* 입력 */
.form{display:grid;gap:16px;margin-bottom:22px;}
.f2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.lab{display:block;font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:8px;}
.lab .tip{font-weight:400;color:var(--text-3);font-size:13.5px;}
.seg{display:flex;flex-wrap:wrap;gap:8px;}
.seg label{position:relative;flex:1 1 0;min-width:96px;}
.seg input{position:absolute;opacity:0;width:0;height:0;}
.seg span{display:block;text-align:center;padding:12px 10px;font-size:16px;font-weight:500;
  background:var(--surface);border:1.5px solid var(--line-2);border-radius:11px;color:var(--text-2);
  cursor:pointer;transition:.13s;}
.seg span small{display:block;font-size:12.5px;font-weight:400;color:var(--text-3);margin-top:1px;}
.seg span:hover{border-color:var(--brand-line);background:var(--brand-soft);}
.seg input:checked + span{background:var(--brand);border-color:var(--brand);color:#fff;}
.seg input:checked + span small{color:rgba(255,255,255,.85);}
.seg input:focus-visible + span{outline:3px solid var(--brand-line);outline-offset:2px;}
.seg input:disabled + span{opacity:.35;cursor:not-allowed;}
input[type="text"],input[type="number"],input[type="date"],select{
  width:100%;font-family:inherit;font-size:16px;padding:12px 14px;
  border:1.5px solid var(--line-2);border-radius:11px;background:var(--surface);color:var(--ink);}
input[type="number"]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
input:focus,select:focus{outline:3px solid var(--brand-line);outline-offset:-1px;border-color:var(--brand);}
.hintline{font-size:13.5px;color:var(--text-3);margin-top:7px;line-height:1.55;}
.hintline b{color:var(--text-2);}
.chkbox{display:flex;gap:11px;align-items:flex-start;padding:13px 16px;background:var(--surface);
  border:1.5px solid var(--line-2);border-radius:11px;cursor:pointer;transition:.13s;}
.chkbox:hover{border-color:var(--brand-line);background:var(--brand-soft);}
.chkbox:has(input:checked){border-color:var(--brand);background:var(--brand-soft);}
.chkbox input{margin-top:3px;width:19px;height:19px;flex:0 0 19px;accent-color:var(--brand);}
.chkbox .t{font-size:15.5px;}
.chkbox .t b{font-weight:600;}
.chkbox .t em{display:block;font-style:normal;font-size:13.5px;color:var(--text-3);margin-top:3px;line-height:1.5;}

/* 요금 계산 */
.calc{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start;}
@media (max-width:1040px){.calc{grid-template-columns:1fr;}}
.pchoose{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
@media (max-width:600px){.pchoose{grid-template-columns:1fr;}}
.pchoose label{position:relative;}
.pchoose input{position:absolute;opacity:0;width:0;height:0;}
.pcard{display:block;padding:16px 14px 17px;border:1.5px solid var(--line-2);border-radius:13px;
  background:var(--surface);cursor:pointer;text-align:center;transition:.14s;}
.pcard:hover{border-color:var(--brand-line);background:var(--brand-soft);}
.pchoose input:checked + .pcard{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.pchoose input:focus-visible + .pcard{outline:3px solid var(--brand-line);outline-offset:2px;}
.pcard .pn{display:block;font-size:13.5px;font-weight:600;color:var(--text-3);}
.pchoose input:checked + .pcard .pn{color:var(--brand);}
.pcard .pd{display:block;font-size:28px;font-weight:700;line-height:1.2;margin-top:2px;color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.pchoose input:checked + .pcard .pd{color:var(--brand);}
.pcard .pf{display:block;font-size:20px;font-weight:600;margin-top:11px;padding-top:11px;
  border-top:1px dashed var(--line-2);color:var(--ink);}
.pchoose input:checked + .pcard .pf{color:var(--brand-d);}
.pcard .pl{display:block;font-size:12px;color:var(--text-3);margin-top:1px;}
.pcard .ps{display:block;font-size:13px;color:var(--text-3);margin-top:6px;}

.resbox{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
.res-h{padding:17px 21px 13px;border-bottom:1px solid var(--line);}
.res-h .code{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;color:var(--brand);}
.res-h .chip{float:right;font-size:13px;font-weight:600;background:var(--brand-soft);
  border:1px solid var(--brand-line);color:var(--brand-d);padding:3px 11px;border-radius:99px;}
.res-h .desc{font-size:14px;color:var(--text-3);margin-top:7px;line-height:1.5;clear:both;}
.lines{padding:8px 21px 6px;}
.ln{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);}
.ln:last-child{border-bottom:0;}
.ln .k{font-size:15px;color:var(--text-2);}
.ln .k em{display:block;font-style:normal;font-size:12.5px;color:var(--text-3);margin-top:1px;}
.ln .v{margin-left:auto;font-size:18px;font-weight:600;white-space:nowrap;}
.ln.g .v{color:var(--brand);}
.ln.r .v{color:var(--good);}
.final{margin:8px 18px 16px;padding:20px 22px;border-radius:13px;
  background:var(--brand);border:1.5px solid var(--brand);}
.final .cap{font-size:14px;font-weight:600;color:rgba(255,255,255,.92);}
.final .big{font-size:42px;font-weight:700;line-height:1.1;margin-top:5px;color:#fff;letter-spacing:-.03em;}
.final .per{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:7px;}
.verdict{margin:0 18px 16px;padding:15px 18px;border-radius:12px;font-size:15.5px;line-height:1.6;}
.verdict.ok{background:var(--good-soft);border:1.5px solid var(--good-line);color:var(--good);}
.verdict.warn{background:var(--warn-soft);border:1.5px solid var(--warn-line);color:var(--warn);}
.verdict.no{background:var(--crit-soft);border:1.5px solid var(--crit-line);color:var(--crit);}
.verdict .nm{font-size:22px;font-weight:700;display:block;margin-bottom:3px;}
.verdict b{font-weight:600;}
.prepay{margin:0 18px 16px;padding:14px 17px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--brand-line);font-size:15px;color:var(--text-2);line-height:1.65;}
.prepay b{color:var(--brand-d);font-weight:600;}

table.ref{width:100%;border-collapse:collapse;font-size:14.5px;}
table.ref th,table.ref td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;}
table.ref th:first-child,table.ref td:first-child{text-align:left;}
table.ref thead th{color:var(--text-3);font-weight:500;font-size:13px;border-bottom:1.5px solid var(--line-2);}
table.ref td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--text-2);}
table.ref tr.hl td{background:var(--brand-soft);color:var(--brand-d);font-weight:600;}
.scrollx{overflow-x:auto;}

/* 하단 이동 바 */
.bar{
  flex:0 0 auto;background:var(--surface);border-top:1.5px solid var(--line);
  padding:12px 46px;display:flex;align-items:center;gap:12px;z-index:20;
}
/* 터치 노트북 — 손가락으로 눌러도 편한 크기 */
.bar .btn{min-height:52px;}
.bar .btn.pri{min-width:180px;font-size:18px;}
@media (max-width:760px){.bar{padding:10px 16px;}.bar .btn.pri{min-width:130px;font-size:16px;}}
@media (max-width:760px){.bar{padding:12px 18px;}}
.bar .mid{margin-left:auto;margin-right:auto;font-size:15px;color:var(--text-3);
  display:flex;align-items:baseline;gap:10px;}
.bar .mid b{color:var(--ink);font-weight:600;font-size:16px;}
.bar .mid .pg{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--brand);
  background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:99px;padding:2px 10px;}
@media (max-width:820px){.bar .mid b{display:none;}}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--text-2);}

/* 요약 */
.sum{background:var(--surface);border:2px solid var(--brand-line);border-radius:16px;
  padding:26px 30px;margin-bottom:22px;}
.sum h3{font-family:"Gowun Batang",serif;font-size:24px;margin:0 0 16px;color:var(--brand-d);}
.sum-row{display:flex;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:16.5px;}
.sum-row:last-child{border-bottom:0;}
.sum-row .k{color:var(--text-3);min-width:132px;flex:0 0 132px;}
.sum-row .v{color:var(--ink);font-weight:500;}
.sum-row.big .v{font-size:22px;font-weight:700;color:var(--brand);}

.tel{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px;}
.tel .t{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:17px 19px;}
.tel .t .nm{font-size:15px;color:var(--text-3);}
.tel .t .no{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;color:var(--brand-d);margin-top:3px;}

/* ── 질문·답 (비교 단계) ── */
.qa{display:grid;gap:14px;}
.qa-item{border:1.5px solid var(--line);border-radius:13px;padding:16px 19px;background:var(--surface);}
.qa-q{font-size:17.5px;font-weight:600;color:var(--ink);margin-bottom:9px;line-height:1.5;}
.qa-a{font-size:17px;color:var(--brand-d);background:var(--brand-soft);border-radius:9px;
  padding:10px 14px;margin-bottom:9px;font-weight:500;}
.qa-w{font-size:15.5px;color:var(--text-2);line-height:1.65;}

/* ── 산모님이 직접 고르는 화면 ── */
.pick{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:20px;}
.pk{
  background:var(--surface);border:2px solid var(--line-2);border-radius:15px;
  padding:22px 18px;text-align:center;cursor:pointer;transition:.16s;font-family:inherit;
}
.pk:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(194,24,91,.55);}
.pk.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 4px rgba(194,24,91,.1);}
.pk .em{font-size:34px;line-height:1;display:block;margin-bottom:10px;}
.pk .tl2{font-size:17.5px;font-weight:600;color:var(--ink);display:block;}
.pk .sb{font-size:14px;color:var(--text-3);display:block;margin-top:4px;line-height:1.45;}
.pk.sel .tl2{color:var(--brand-d);}
.pk:focus-visible{outline:3px solid var(--brand-line);outline-offset:3px;}

/* 고르신 항목 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.cp{display:inline-block;font-size:15px;padding:6px 14px;border-radius:99px;
  background:var(--surface-2);border:1.5px solid var(--line-2);color:var(--text-2);}
.cp.st{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}

.qhead{font-size:22px;font-weight:600;color:var(--ink);margin:0 0 4px;letter-spacing:-.015em;}
.qhead.big{font-family:"Gowun Batang",serif;font-size:36px;font-weight:700;line-height:1.3;
  margin-bottom:6px;letter-spacing:-.025em;text-wrap:balance;}
@media (max-width:760px){.qhead.big{font-size:26px;}}
.onequestion{padding:6px 0 4px;}
.pick.big{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;}
.pick.big .pk{padding:30px 20px;}
.pick.big .em{font-size:44px;margin-bottom:12px;}
.pick.big .tl2{font-size:20px;}
.pick.big .sb{font-size:15px;}
.qcount{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--brand);font-weight:600;
  background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:99px;padding:2px 11px;
  display:inline-block;margin-bottom:10px;}
.qsub{font-size:16px;color:var(--text-3);margin:0 0 18px;}

/* 결과 카드 */
.result-card{
  background:linear-gradient(160deg,#C2185B 0%,#98123F 100%);
  color:#fff;border-radius:18px;padding:32px 34px;margin-bottom:20px;
}
.result-card .rl{font-size:14px;font-weight:600;letter-spacing:.08em;opacity:.85;}
.result-card .rt{font-family:"Gowun Batang",serif;font-size:34px;font-weight:700;
  margin:6px 0 12px;line-height:1.25;letter-spacing:-.02em;}
@media (max-width:640px){.result-card .rt{font-size:26px;}}
.result-card .rd{font-size:17.5px;line-height:1.7;opacity:.95;max-width:60ch;}
.result-card .rd b{color:#FFE0EE;font-weight:600;}
.reco{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:22px;}
.reco .r{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  border-radius:12px;padding:15px 17px;}
.reco .r h5{margin:0 0 5px;font-size:15.5px;font-weight:600;color:#fff;}
.reco .r p{margin:0;font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.9);}

/* 금액 맞추기 */
.guess{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:20px;}
.gk{background:var(--surface);border:2px solid var(--line-2);border-radius:14px;padding:24px 14px;
  text-align:center;cursor:pointer;transition:.16s;font-family:inherit;}
.gk:hover{border-color:var(--brand);transform:translateY(-2px);}
.gk .amt{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
.gk .lb{font-size:13.5px;color:var(--text-3);margin-top:4px;}
.gk.picked{border-color:var(--text-3);background:var(--surface-2);}
.gk.answer{border-color:var(--good);background:var(--good-soft);}
.gk.answer .amt{color:var(--good);}
.gk .mk{display:block;font-size:12.5px;font-weight:600;margin-top:6px;}
.gk.picked .mk{color:var(--text-3);}
.gk.answer .mk{color:var(--good);}

.reveal{background:var(--surface);border:2px solid var(--brand);border-radius:16px;
  padding:28px 32px;margin-bottom:20px;text-align:center;}
.reveal .rv-l{font-size:15px;color:var(--text-2);}
.reveal .rv-big{font-family:"IBM Plex Mono",monospace;font-size:52px;font-weight:700;
  color:var(--brand);line-height:1.1;margin:8px 0;letter-spacing:-.03em;}
@media (max-width:640px){.reveal .rv-big{font-size:38px;}}
.reveal .rv-s{font-size:16.5px;color:var(--text-2);line-height:1.6;}
.reveal .rv-s b{color:var(--brand-d);font-weight:600;}

/* O/X 퀴즈 */
.quiz{background:var(--surface);border:1.5px solid var(--line);border-radius:15px;
  padding:22px 26px;margin-bottom:16px;box-shadow:var(--shadow);}
.quiz .qn{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--brand);}
.quiz .qt{font-size:19.5px;font-weight:600;color:var(--ink);margin:6px 0 15px;line-height:1.5;}
.ox{display:flex;gap:12px;margin-bottom:0;}
.ox button{flex:1;font-family:inherit;font-size:26px;font-weight:700;padding:15px;
  border:2px solid var(--line-2);border-radius:13px;background:var(--surface);
  cursor:pointer;color:var(--text-3);transition:.15s;}
.ox button:hover{border-color:var(--brand);color:var(--brand);}
.ox button.right{border-color:var(--good);background:var(--good-soft);color:var(--good);}
.ox button.wrong{border-color:var(--crit);background:var(--crit-soft);color:var(--crit);}
.ox button:focus-visible{outline:3px solid var(--brand-line);outline-offset:2px;}
.qans{margin-top:15px;padding:15px 18px;border-radius:12px;font-size:16px;line-height:1.65;}
.qans.o{background:var(--good-soft);border:1.5px solid var(--good-line);color:var(--good);}
.qans.x{background:var(--warn-soft);border:1.5px solid var(--warn-line);color:var(--warn);}
.qans b{font-weight:600;}
.qscore{font-size:17px;font-weight:600;color:var(--brand-d);background:var(--brand-soft);
  border:1.5px solid var(--brand-line);border-radius:12px;padding:15px 20px;margin-bottom:18px;}

/* 사진 자리 */
.ph{border:2px dashed var(--line-2);border-radius:13px;background:var(--surface-2);
  min-height:150px;display:grid;place-items:center;text-align:center;padding:20px;}
.ph .pt{font-size:15px;color:var(--text-3);line-height:1.6;}
.ph .pf{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--brand);
  background:#fff;border:1px solid var(--brand-line);border-radius:7px;padding:3px 10px;
  display:inline-block;margin-top:8px;}
.ph img{max-width:100%;border-radius:11px;display:block;}
figure.shot{margin:0;}
figure.shot img{width:100%;border-radius:13px;border:1.5px solid var(--line);display:block;}
figure.shot figcaption{font-size:14px;color:var(--text-3);margin-top:8px;}

/* 자주 묻는 질문 패널 */
.fabs{position:fixed;right:22px;bottom:88px;z-index:60;display:flex;flex-direction:column;gap:10px;}
.fab{
  background:var(--brand);color:#fff;border:0;border-radius:99px;
  padding:14px 22px;font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;
  box-shadow:0 8px 24px -8px rgba(194,24,91,.65);transition:.15s;
}
.fab:hover{background:var(--brand-d);}
.fab:focus-visible{outline:3px solid var(--brand-line);outline-offset:3px;}
@media (max-width:760px){.fabs{right:14px;bottom:78px;}.fab{padding:12px 17px;font-size:14px;}}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(35,26,30,.5);display:none;}
.sheet.open{display:block;}
.sheet-in{
  position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);
  background:var(--surface);border-left:1.5px solid var(--line);
  display:flex;flex-direction:column;
}
.sheet-h{padding:20px 24px 14px;border-bottom:1.5px solid var(--line);}
.sheet-h h3{margin:0 0 4px;font-family:"Gowun Batang",serif;font-size:22px;color:var(--brand-d);}
.sheet-h p{margin:0;font-size:14px;color:var(--text-3);}
.sheet-tabs{display:flex;gap:8px;margin-top:13px;}
.sheet-tabs button{flex:1;font-family:inherit;font-size:14.5px;font-weight:500;padding:9px;
  border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;color:var(--text-2);cursor:pointer;}
.sheet-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.sheet-s{padding:12px 24px 0;}
.sheet-s input{width:100%;}
.sheet-b{flex:1;overflow-y:auto;padding:14px 24px 24px;}
.fq{border-bottom:1px solid var(--line);padding:13px 0;}
.fq:last-child{border-bottom:0;}
.fq .q{font-size:16.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;gap:9px;align-items:flex-start;}
.fq .q::before{content:"Q";font-family:"IBM Plex Mono",monospace;color:var(--brand);flex:0 0 auto;font-weight:700;}
.fq .a{font-size:15.5px;color:var(--text-2);line-height:1.7;margin-top:8px;padding-left:22px;display:none;}
.fq.open .a{display:block;}
.fq .a b{color:var(--ink);font-weight:600;}
.fq .a .warn{color:var(--warn);font-weight:600;}
.sheet-x{position:absolute;left:-52px;top:16px;width:40px;height:40px;border-radius:99px;
  background:var(--surface);border:1.5px solid var(--line);cursor:pointer;font-size:19px;color:var(--text-2);}
@media (max-width:760px){.sheet-x{left:auto;right:16px;top:-52px;}}

@media print{
  .rail,.bar,.script,.chk,.fabs,.sheet{display:none;}
  .app{grid-template-columns:1fr;}
  .slide{padding:0;}
  body{background:#fff;font-size:12px;}
  .box{box-shadow:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div class="cover" id="cover">
  <div class="cv">
    <div class="lg">참사랑어머니회<br>베이비페어 상담</div>
    <div class="sb">산모님과 함께 보면서 진행합니다.<br>버튼 하나로 시작해 <b>다음</b>만 누르시면 됩니다.</div>
    <button class="btn pri go" id="startBtn" type="button">상담 시작하기</button>
    <div class="hint">
      <span class="kbd">→</span> 다음 · <span class="kbd">←</span> 이전 ·
      <span class="kbd">N</span> 상담자 대본 · <span class="kbd">F</span> 질문 찾기<br>
      시작하면 <b>전체화면</b>으로 바뀝니다. 끝내려면 <span class="kbd">Esc</span>.
    </div>
  </div>
</div>

<div class="railveil" id="railveil"></div>
<div class="app">
  <!-- ════ 왼쪽 진행 목록 ════ -->
  <nav class="rail">
    <div class="rail-h">
      <div class="logo">참사랑어머니회</div>
      <div class="tag">베이비페어 상담 · 창원</div>
      <div class="prog"><i id="progBar" style="width:0%"></i></div>
      <div class="prog-t" id="progTxt">0 / 0</div>
    </div>
    <div class="steps" id="stepNav"></div>
    <div class="rail-f">
      <button class="btn" id="scriptBtn" type="button">상담 대본 보기</button>
      <button class="btn" id="resetBtn" type="button">새 상담 시작</button>
    </div>
  </nav>

  <!-- ════ 무대 ════ -->
  <main class="stage">
    <div class="slide" id="slide"><div class="fitbox" id="fitbox"></div></div>
    <div class="drawer" id="drawer"><div class="drawer-in" id="drawerIn"></div></div>
    <div class="fabs">
      <button class="fab" id="faqFab" type="button">자주 묻는 질문</button>
    </div>
    <div class="bar">
      <button class="btn" id="menuBtn" type="button">☰ 목차</button>
      <button class="btn" id="prevBtn" type="button">← 이전</button>
      <span class="mid" id="barMid"></span>
      <button class="btn" id="scriptBtn2" type="button">대본</button>
      <button class="btn pri lg" id="nextBtn" type="button">다음 →</button>
    </div>
  </main>
</div>

<div class="sheet" id="faqSheet">
  <div class="sheet-in">
    <button class="sheet-x" id="faqX" type="button">✕</button>
    <div class="sheet-h">
      <h3>바로 찾아 답하기</h3>
      <p>산모님 질문에 그 자리에서 답하세요. 상담자 화면입니다.</p>
      <div class="sheet-tabs">
        <button data-tab="faq" class="on" type="button">자주 묻는 질문</button>
        <button data-tab="obj" type="button">이런 말 나오면</button>
      </div>
      <div class="sheet-s" style="padding-left:0;padding-right:0;">
        <input type="text" id="faqSearch" placeholder="검색 — 예: 환급, 큰아이, 교체">
      </div>
    </div>
    <div class="sheet-b" id="faqBody"></div>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   요금 데이터 — 창원시 2026년 고시표 (단위: 천 원)
   서비스가격 = 정부지원금 + 본인부담금, 환급 = 본인부담금×90%(15일 상한)
   → 108개 항목 원본 대조 검증 완료
   ═══════════════════════════════════════════════════════════════ */
var DAYS = {A1:[5,10,15],A2:[10,15,20],A3:[10,15,20],B1:[10,15,20],B2:[10,15,20],C1:[15,25,40]};
var TABLE = {
  "A-가-1":{gov:[659,1165,1525],self:[73,299,671]},
  "A-통합-1":{gov:[569,1002,1303],self:[163,462,893]},
  "A-라-1":{gov:[456,764,1035],self:[276,700,1161]},
  "A-가-2":{gov:[1345,1794,2094],self:[119,402,834]},

function letterOf(){
  var seq = ["A","B","C","D"], base = S.fetus === "single" ? 0 : S.fetus === "twin" ? 1 : 2;
  return seq[base + (S.disability ? 1 : 0)];
}
function incomeOf(){
  var fam = S.fam;
  if (S.basic) return {code:"가", label:"수급자 · 차상위", entered:true, fam:fam, band:"under150"};
  if (S.mode === "income") {
    var a = parseFloat(S.incA)||0, b = parseFloat(S.incB)||0, t = a+b;
    var l1 = FEE150[fam].income, l8 = limit180(fam);
    var band = t <= l1 ? "under150" : (t <= l8 ? "between" : "over180");
    return {code: band==="under150"?"통합":"라",
      label: band==="under150"?"중위소득 150% 이하":"중위소득 150% 초과",
      mode:"income", entered:t>0, total:t, limit:l1, limit180:l8, fam:fam, band:band,
      formula:(a>0&&b>0)?(won(a)+" + "+won(b)+" = "+won(t)):won(t)};
  }
  var fa = parseFloat(S.feeA)||0, fb = parseFloat(S.feeB)||0, tt, fm;
  if (S.dual && fa>0 && fb>0){ var lo=Math.min(fa,fb), hi=Math.max(fa,fb); tt=hi+lo*.5;
    fm = won(hi)+" + ("+won(lo)+" × 0.5) = "+won(tt); }
  else { tt=fa+fb; fm=(fa>0&&fb>0)?(won(fa)+" + "+won(fb)+" = "+won(tt)):won(tt); }
  var lim = FEE150[fam][S.ins], under = tt <= lim;
  return {code:under?"통합":"라", label:under?"중위소득 150% 이하":"중위소득 150% 초과",
    mode:"fee", entered:(fa>0||fb>0), total:tt, limit:lim, fam:fam, ins:S.ins, formula:fm,
    band: under?"under150":"unknownOver"};
}
function quote(){
  var L = letterOf(), inc = incomeOf();
  var numIdx, dk;
  if (L === "A"){ numIdx = S.order; dk = "A"+S.order; }
  else if (L === "B"){ numIdx = S.staff; dk = "B"+S.staff; }
  else { numIdx = 1; dk = "C1"; }
  if (L === "D") return {unavailable:true, inc:inc, letter:"D"};
  var days = DAYS[dk], row = TABLE[L+"-"+inc.code+"-"+numIdx];
  if (!row) return {unavailable:true, inc:inc, letter:L};
  var capIdx = -1;
  for (var j=0;j<3;j++) if (days[j] <= DAYCAP) capIdx = j;
  var capSelf = capIdx >= 0 ? row.self[capIdx]*1000 : 0;
  var all = [];
  for (var k=0;k<3;k++){
    var g = row.gov[k]*1000, s = row.self[k]*1000;
    var rf = Math.round(Math.min(s, capSelf)*RATE);
    all.push({gov:g, self:s, price:g+s, refund:rf, final:s-rf, capped:Math.min(s,capSelf)<s});
  }
  return {unavailable:false, letter:L, numIdx:numIdx, inc:inc, days:days, all:all,
          capSelf:capSelf, code:L+"-"+inc.code+"-"+CIRCLED[numIdx]+"형"};
}

];
var QA_STATE = {};
var qzIdx = 0;

function s_quiz(){
  var answered = Object.keys(QA_STATE).length;
  var right = 0;
  Object.keys(QA_STATE).forEach(function(k){ if (QA_STATE[k] === QUIZ[k].a) right++; });

  var h = head("함께 해보기", "이건 될까요, 안 될까요?",
    "산모님이 직접 맞춰보세요. <b>여기서 틀리시는 것들이 나중에 제일 많이 부딪히는 부분</b>입니다.");

  if (answered === QUIZ.length && qzIdx >= QUIZ.length-1){
    h += '<div class="qscore">'+QUIZ.length+'문제 중 <b>'+right+'개</b> 맞히셨습니다. ' +
      (right >= 4 ? '이미 잘 알고 계시네요!' : '이래서 미리 알고 계셔야 합니다. 하나씩 다시 짚어드릴게요.') + '</div>';
  }

  [QUIZ[Math.min(qzIdx, QUIZ.length-1)]].forEach(function(q){
    var i = Math.min(qzIdx, QUIZ.length-1);
    var ans = QA_STATE[i];
    var oCls = "", xCls = "";
    if (ans !== undefined){
      oCls = q.a === true ? " right" : (ans === true ? " wrong" : "");
      xCls = q.a === false ? " right" : (ans === false ? " wrong" : "");
    }
    h += '<div class="quiz"><span class="qn">Q'+(i+1)+'</span><div class="qt">'+q.q+'</div>' +
      '<div class="ox"><button type="button" data-qz="'+i+'" data-qv="1" class="'+oCls.trim()+'">O</button>' +
      '<button type="button" data-qz="'+i+'" data-qv="0" class="'+xCls.trim()+'">X</button></div>';
    if (ans !== undefined){
      var ok = (ans === q.a);
      h += '<div class="qans '+(q.a ? "o" : "x")+'"><b>정답은 '+(q.a?"O":"X")+'입니다'+(ok?" — 맞히셨어요!":"")+'</b><br>'+q.x+'</div>';
    }
    h += '</div>';
  });

  return h + script([
    "잠깐 재미있게 하나 해볼까요? 이건 될까요, 안 될까요? 산모님이 맞춰보세요.",
    "관리사님이 손톱 깎아주실 수 있을까요? … 아쉽게도 안 돼요. 관리사님은 의료인이 아니셔서 의료행위는 못 하세요.",
    "이런 것들을 미리 아셔야 나중에 서운하지 않으세요. 그래서 일부러 퀴즈로 내드리는 거예요."
  ], "주의사항을 <b>그냥 읽으면 잔소리</b>가 되지만, 문제로 내면 산모님이 기억하십니다. 틀리셔도 &ldquo;대부분 이렇게 아세요&rdquo;라고 편하게 받아주세요.") +
  checklist("quiz", [
    "산모님이 직접 O/X를 누르시게 하기",
    "의료행위 제외 — 반드시 짚기",
    "큰아이 추가 요금 — 반드시 짚기",
    "교체 가능 → 244명 인력으로 연결",
    "90% 환급 → 먼저 결제 후 나중에 받는 순서"
  ]);
}

  var sum = '<div class="sum"><h3>오늘 상담 요약</h3>';
  sum += row("상황", situation());
  if (TF.jori) sum += row("산후조리 계획", tfLabel("jori", TF.jori));
  if (TF.help) sum += row("도와주실 분", tfLabel("help", TF.help));
  if (tfWants().length) sum += row("바라시는 관리사", tfWants().map(function(v){ return tfLabel("want", v); }).join(" · "));
  if ((TF.focus||[]).length) sum += row("중점 케어", TF.focus.map(function(v){ return tfLabel("focus", v); }).join(" · "));
  if ((TF.choose||[]).length) sum += row("중요하게 보는 것", TF.choose.map(function(v){ return tfLabel("choose", v); }).join(" · "));
  if ((TF.fear||[]).length) sum += row("걱정하신 부분", TF.fear.map(function(v){ return tfLabel("fear", v); }).join(" · "));
  if (!q.unavailable && q.inc.entered) {
    var r = q.all[S.period];
    sum += row("유형", q.code + " · " + PNAME[S.period] + " " + q.days[S.period] + "일");
    sum += row("본인부담금", won(r.self) + "  (먼저 결제)");
    sum += row("창원시 환급", "− " + won(r.refund));
    sum += '<div class="sum-row big"><span class="k">최종 부담액</span><span class="v num">'+won(r.final)+'</span></div>';
  } else {
    sum += row("요금", "소득 정보 미입력 — 계산 안 됨");
  }
  sum += '</div>';

  return head("마무리", "오늘 나눈 이야기, 이렇게 정리됩니다",
    "이 내용이 <b>담당자에게 그대로 전달</b>되고, 관리사님 배정에도 반영됩니다.") + sum +
  script([
    "오늘 나눈 이야기 한번 정리해 드릴게요.",
    "고객님은 이런 상황이시고, 이런 부분을 걱정하고 계시고, 이런 관리사님을 바라신다고 하셨어요.",
    "금액은 최종적으로 이만큼 나가시게 돼요.",
    "이 내용 그대로 담당자한테 전달돼서, 나중에 연락드릴 때 처음부터 다시 여쭤보지 않아도 돼요."
  ], "요약을 <b>소리 내어 읽어드리세요.</b> &ldquo;내 이야기를 다 들었구나&rdquo;가 느껴져야 연락처를 주십니다. " +
     "<b>인쇄</b>해서 드리면 집에 가서도 우리 회사가 후보에 남습니다.") +
  checklist("summary", [
    "요약을 소리 내어 읽어드리기",
    "&ldquo;다시 여쭤보지 않아도 된다&rdquo;고 말하기",
    "인쇄해서 손에 들려 보내기"
  ]);
}

function row(k,v){ return '<div class="sum-row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
function situation(){
  var f = {single:"단태아", twin:"쌍태아", triplet:"삼태아 이상"}[S.fetus];
  var o = ["","첫째아","둘째아","셋째아 이상"][S.order];
  var i = S.basic ? "수급자·차상위" : incomeOf().label;
  return f + " · " + o + " · " + i;
}

/* ═══════════ 입력 조각 ═══════════ */
function esc(s){ return String(s == null ? "" : s).replace(/"/g,"&quot;"); }
function seg(key, val, label, sub){
  var on = (String(S[key]) === String(val)) ? " checked" : "";
  return '<label><input type="radio" name="'+key+'" data-s="'+key+'" value="'+val+'"'+on+'>' +
    '<span>'+label+(sub?'<small>'+sub+'</small>':'')+'</span></label>';
}
function select(key, opts){
  var h = '<select data-s="'+key+'">';
  opts.forEach(function(o){ h += '<option value="'+o[0]+'"'+(String(S[key])===String(o[0])?" selected":"")+'>'+o[1]+'</option>'; });
  return h + '</select>';
}
function numin(key, ph){
  return '<div><input type="number" data-s="'+key+'" min="0" step="100000" inputmode="numeric" ' +
    'placeholder="'+ph+'" value="'+esc(S[key])+'"><div class="hintline">'+ph+'</div></div>';
}

/* ═══════════ 렌더 ═══════════ */
var showScript = false;

function renderNav(){
  var v = visible(), pos = v.indexOf(cur), h = "", lastG = null;
  v.forEach(function(i, n){
    var s = STEPS[i];
    if (s.group !== lastG){ h += '<div class="sgroup">'+s.group+'</div>'; lastG = s.group; }
    var cls = "snav" + (i === cur ? " on" : (n < pos ? " done" : ""));
    h += '<button class="'+cls+'" data-go="'+i+'" type="button">' +
         '<span class="sn">'+(n < pos ? "✓" : (n+1))+'</span><span class="st">'+s.nav+'</span></button>';
  });
  document.getElementById("stepNav").innerHTML = h;

  var pct = v.length > 1 ? Math.round(pos / (v.length - 1) * 100) : 0;
  document.getElementById("progBar").style.width = pct + "%";
  document.getElementById("progTxt").textContent = (pos + 1) + " / " + v.length + " · " + STEPS[cur].nav;
  var bm = document.getElementById("barMid");
  if (bm) bm.innerHTML = '<b>' + STEPS[cur].nav + '</b> <span class="pg">' + (pos+1) + ' / ' + v.length + '</span>';
}

function render(){
  var fb = document.getElementById("fitbox");
  fb.innerHTML = STEPS[cur].render();

  /* 대본 · 체크리스트는 본문에서 빼내 아래 서랍으로 — 화면을 비웁니다 */
  var dr = document.getElementById("drawerIn");
  dr.innerHTML = "";
  fb.querySelectorAll(".note").forEach(function(n){ if (n.querySelector(".tbd")) n.setAttribute("data-staff",""); });
  fb.querySelectorAll("[data-script], .chk, [data-staff]").forEach(function(el){
    el.hidden = false;
    dr.appendChild(el);
  });
  document.getElementById("drawer").classList.toggle("open", showScript);
  document.getElementById("scriptBtn").textContent = showScript ? "상담자 화면 닫기" : "상담자 화면 열기";
  document.getElementById("scriptBtn").classList.toggle("on", showScript);
  document.getElementById("scriptBtn2").classList.toggle("on", showScript);

  var v = visible(), pos = v.indexOf(cur);
  var inner = (STEPS[cur].render === s_typefinder && tfIdx > 0) ||
              (STEPS[cur].render === s_quiz && qzIdx > 0);
  var atStart = (pos <= 0) && !inner;
  document.getElementById("prevBtn").disabled = atStart;
  document.getElementById("prevBtn").style.opacity = atStart ? ".4" : "1";
  document.getElementById("nextBtn").textContent = (pos === v.length - 1) ? "처음으로" : "다음 →";

  renderNav();
  refresh();
  loadPhotos();

  var sl = document.getElementById("slide");
  sl.scrollTop = 0;
  fb.classList.remove("slide-anim");
  void fb.offsetWidth;
  fb.classList.add("slide-anim");
  fitScreen();

  var st = document.querySelector(".snav.on");
  if (st) st.scrollIntoView({block:"nearest"});
}

/* 화면 높이에 맞춰 자동으로 줄여 한 화면에 담습니다 */
function fitScreen(){
  var sl = document.getElementById("slide"), fb = document.getElementById("fitbox");
  fb.style.transform = "";
  sl.classList.remove("scrolls");
  var avail = sl.clientHeight - 8;
  var need = fb.scrollHeight;
  if (need <= avail || need === 0) return;
  var k = avail / need;
  if (k < 0.62){ sl.classList.add("scrolls"); return; }   /* 너무 작아지면 스크롤 허용 */
  fb.style.transform = "scale(" + k.toFixed(3) + ")";
}
var fitTimer;
window.addEventListener("resize", function(){
  clearTimeout(fitTimer); fitTimer = setTimeout(fitScreen, 120);
});

/* 동적 부분 갱신 (계산기 · 판정 · 체크리스트 카운트) */
function refresh(){
  var L = letterOf();

  var sw = document.getElementById("staffWrap");
  if (sw){
    sw.hidden = !(L === "B" || L === "C");
    var s1 = document.querySelector('input[name="staff"][value="1"]');
    if (s1){
      if (L === "C"){ S.staff = 2; var s2 = document.querySelector('input[name="staff"][value="2"]');
        if (s2) s2.checked = true; s1.disabled = true; }
      else s1.disabled = false;
    }
  }
  var on = document.getElementById("orderNote");
  if (on) on.textContent = (L === "A") ? "" : (L + "형은 출산 순위와 관계없이 금액이 같습니다.");

  var mi = document.getElementById("modeIncome"), mf = document.getElementById("modeFee");
  if (mi) mi.hidden = (S.mode !== "income");
  if (mf) mf.hidden = (S.mode !== "fee");
  var iw = document.getElementById("incWrap");
  if (iw){ iw.style.opacity = S.basic ? ".4" : "1"; iw.style.pointerEvents = S.basic ? "none" : "auto"; }

  var q = quote();
  var iv = document.getElementById("intakeVerdict");
  if (iv) iv.innerHTML = verdictHTML(q.inc);
  var rb = document.getElementById("resBox");
  if (rb) rb.innerHTML = resultHTML(q);

  if (!q.unavailable) {
    for (var i=0;i<3;i++){
      var pd = document.getElementById("pd"+i);
      if (!pd) break;
      pd.textContent = q.days[i] + "일";
      document.getElementById("pf"+i).textContent = won(q.all[i].final);
      document.getElementById("ps"+i).textContent = "결제 " + won(q.all[i].self);
    }
  } else {
    for (var j=0;j<3;j++){
      var e = document.getElementById("pd"+j);
      if (!e) break;
      e.textContent = "–"; document.getElementById("pf"+j).textContent = "–";
      document.getElementById("ps"+j).textContent = "";
    }
  }

  document.querySelectorAll(".chk").forEach(function(box){
    var ins = box.querySelectorAll("input[data-chk]");
    var done = 0;
    ins.forEach(function(x){ if (x.checked) done++; });
    var c = box.querySelector(".cnt");
    if (c) c.textContent = done + " / " + ins.length;
  });
}

function verdictHTML(inc){
  if (!inc.entered && inc.code !== "가")
    return '<div class="verdict warn"><span class="nm">소득 미입력</span>값을 넣으면 <b>통합형인지 라형인지</b> 바로 나옵니다.</div>';
  var nm, why, cls, ref;
  if (inc.code === "가"){
    nm = "가형"; cls = "ok"; why = "수급자 · 차상위 — 본인부담금이 가장 적은 구간입니다.";
    ref = "<b>창원시 90% 환급 대상입니다.</b>";
  } else if (inc.mode === "income"){
    nm = inc.code === "통합" ? "통합형" : "라형";
    why = "부부 합산 <span class='num'>" + inc.formula + "</span> · " + inc.fam + "인 가구 150% 기준선 <span class='num'>" +
          won(inc.limit) + "</span> " + (inc.code === "통합" ? "이하" : "초과");
    if (inc.band === "under150"){ cls = "ok"; ref = "<b>창원시 90% 환급 대상입니다.</b>"; }
    else if (inc.band === "between"){ cls = "ok";
      ref = "<b>환급 대상으로 보입니다.</b> 180% 참고선 <span class='num'>"+won(inc.limit180)+"</span> 이하입니다. 최종 확인은 보건소에서."; }
    else { cls = "no";
      ref = "<b>환급을 못 받으실 수 있습니다.</b> 180% 참고선 <span class='num'>"+won(inc.limit180)+"</span>을 넘습니다. 복지로 · 보건소에서 꼭 확인하세요."; }
  } else {
    var insN = {office:"직장", region:"지역", mixed:"혼합"}[inc.ins];
    nm = inc.code === "통합" ? "통합형" : "라형";
    why = "판정 보험료 <span class='num'>" + inc.formula + "</span> · " + inc.fam + "인 " + insN +
          " 기준선 <span class='num'>" + won(inc.limit) + "</span> " + (inc.code === "통합" ? "이하" : "초과");
    if (inc.band === "under150"){ cls = "ok"; ref = "<b>창원시 90% 환급 대상입니다.</b>"; }
    else { cls = "warn"; ref = "<b>환급 대상인지 보건소 확인이 필요합니다.</b> 창원시 환급은 중위소득 180% 이하까지인데, 180% 건강보험료 기준표는 공개 자료로 확인되지 않습니다."; }
  }
  return '<div class="verdict '+cls+'"><span class="nm">'+nm+'</span>'+why+'<div style="margin-top:8px;">'+ref+'</div></div>';
}

      line("본인부담금","산모님이 업체에 먼저 결제", won(r.self), "") +
      line("창원시 환급 (90%)", r.capped ? "15일치까지만 지원 (상한 적용)" : "서비스 끝난 뒤 보건소에서", "− "+won(r.refund), "r") +

    '<div class="final"><div class="cap">최종적으로 내 돈이 나가는 금액</div>' +

var faqTab = "faq";
function renderFaq(){
  var kw = (document.getElementById("faqSearch").value || "").trim();
  var list = (faqTab === "faq") ? FAQ : OBJ;
  var h = "";
  list.forEach(function(it, i){
    if (kw && (it[0]+it[1]).replace(/<[^>]+>/g,"").indexOf(kw) < 0) return;
    h += '<div class="fq" data-fq="'+i+'"><div class="q">'+it[0]+'</div><div class="a">'+it[1]+'</div></div>';
  });
  document.getElementById("faqBody").innerHTML = h ||
    '<p style="color:var(--text-3);padding:20px 0;">검색 결과가 없습니다.</p>';
}

  if (b){ cur = parseInt(b.dataset.go,10); menu(false); render(); }
  if (e.target.id === "newBtn2") reset();

  var tf = e.target.closest("[data-tf]");
  if (tf){
    var k = tf.dataset.tf, v = tf.dataset.tv;
    if (tf.dataset.multi){
      var arr = TF[k] || [];
      var at = arr.indexOf(v);
      if (at >= 0) arr.splice(at,1); else arr.push(v);
      TF[k] = arr;
    } else {
      TF[k] = v;
    }
    if (!tf.dataset.multi && STEPS[cur].render === s_typefinder && tfIdx < TFQ.length){
      tfIdx++;
    }
    render(); return;
  }

  var qz = e.target.closest("[data-qz]");
  if (qz){ QA_STATE[qz.dataset.qz] = (qz.dataset.qv === "1"); render(); return; }

  var gs = e.target.closest("[data-guess]");
  if (gs){ GUESS = parseInt(gs.dataset.guess,10); render(); return; }

  var fq = e.target.closest(".fq");
  if (fq){ fq.classList.toggle("open"); return; }

  var tb = e.target.closest("[data-tab]");
  if (tb){
    faqTab = tb.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(function(x){ x.classList.toggle("on", x === tb); });
    renderFaq(); return;
  }
});

/* 자주 묻는 질문 패널 */
function openFaq(on){
  document.getElementById("faqSheet").classList.toggle("open", on);
  if (on){ renderFaq(); document.getElementById("faqSearch").focus(); }
}
document.getElementById("faqFab").addEventListener("click", function(){ openFaq(true); });
document.getElementById("faqX").addEventListener("click", function(){ openFaq(false); });
document.getElementById("faqSheet").addEventListener("click", function(e){
  if (e.target === this) openFaq(false);
});
document.getElementById("faqSearch").addEventListener("input", renderFaq);
function step(d){
  /* 유형 찾기와 퀴즈는 한 화면에 한 문제씩 — 단계 안에서 먼저 이동 */
  var nm = STEPS[cur] && STEPS[cur].render;
  if (nm === s_typefinder){
    if (d > 0 && tfIdx < TFQ.length){ tfIdx++; render(); return; }
    if (d < 0 && tfIdx > 0){ tfIdx--; render(); return; }
  }
  if (nm === s_quiz){
    if (d > 0 && qzIdx < QUIZ.length-1){ qzIdx++; render(); return; }
    if (d < 0 && qzIdx > 0){ qzIdx--; render(); return; }
  }
  var v = visible(), pos = v.indexOf(cur);
  if (pos < 0) pos = 0;
  var np = pos + d;
  if (np >= v.length) np = 0;
  else if (np < 0) return;
  cur = v[np]; render();
}
document.getElementById("nextBtn").addEventListener("click", function(){ step(1); });
document.getElementById("prevBtn").addEventListener("click", function(){ step(-1); });
document.getElementById("scriptBtn").addEventListener("click", function(){
  showScript = !showScript;
  document.getElementById("drawer").classList.toggle("open", showScript);
  this.textContent = showScript ? "상담자 화면 닫기" : "상담자 화면 열기";
  this.classList.toggle("on", showScript);
  document.getElementById("scriptBtn2").classList.toggle("on", showScript);
  setTimeout(fitScreen, 280);
});

/* 터치 — 좌우로 쓸어서 넘기기 */
(function(){
  var x0 = null, y0 = null;
  var sl = document.getElementById("slide");
  sl.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  sl.addEventListener("touchend", function(e){
    if (x0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)) return;
    if (e.target.closest("button, input, select, a, label")) return;
    step(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

/* 전체화면으로 시작 — 화면 전체가 상담 내용이 됩니다 */
document.getElementById("startBtn").addEventListener("click", function(){
  document.getElementById("cover").classList.add("hide");
  document.body.classList.add("presenting");
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
  setTimeout(fitScreen, 320);
});

/* 목차 여닫기 */
function menu(on){
  document.body.classList.toggle("menu", on);
}
document.getElementById("menuBtn").addEventListener("click", function(){
  menu(!document.body.classList.contains("menu"));
});
document.getElementById("railveil").addEventListener("click", function(){ menu(false); });
document.getElementById("scriptBtn2").addEventListener("click", function(){
  document.getElementById("scriptBtn").click();
});
function reset(){
  S = {name:"",phone:"",due:"",fetus:"single",order:1,staff:1,disability:false,preemie:false,
       basic:false,mode:"income",fam:3,ins:"office",incA:"",incB:"",feeA:"",feeB:"",dual:false,period:1};
  checks = {}; TF = {}; tfIdx = 0; QA_STATE = {}; qzIdx = 0; GUESS = null; cur = 0; render();
}
document.getElementById("resetBtn").addEventListener("click", reset);

document.addEventListener("keydown", function(e){
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (e.key === "Escape"){ openFaq(false); menu(false); return; }
  if (e.key === "ArrowRight"){ step(1); }
  else if (e.key === "ArrowLeft"){ step(-1); }
  else if (e.key === "n" || e.key === "N"){ document.getElementById("scriptBtn").click(); }
  else if (e.key === "f" || e.key === "F"){ openFaq(true); }
});

render();
</script>
