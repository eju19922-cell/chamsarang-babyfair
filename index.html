<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참사랑 베이비페어 상담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#FBF5F3; --surface:#FFFFFF; --surface-2:#FDF1F6;
  --line:#EFDCE4; --line-2:#E3C6D3;
  --ink:#231A1E; --text-2:#5E4A52; --text-3:#8A7079;
  --brand:#C2185B; --brand-d:#98123F; --brand-soft:#FDF1F6; --brand-line:#EDBCD3;
  --gold:#8A6212;
  --navy:#1E3A5F; --navy-d:#162C49; --navy-soft:#EEF3F9; --navy-line:#C9D7E8;
  --good:#0F6B3C; --good-soft:#E4F3EA; --good-line:#A9D6BC;
  --warn:#8A4B02; --warn-soft:#FCF0DE; --warn-line:#E8C79A;
  --crit:#A31D1D; --crit-soft:#FBE8E8; --crit-line:#EDB5B5;
  --shadow:0 1px 2px rgba(120,30,70,.04), 0 16px 40px -22px rgba(150,25,80,.25);
  --shadow-lg:0 2px 4px rgba(120,30,70,.05), 0 28px 60px -28px rgba(150,25,80,.32);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:19px;line-height:1.58;-webkit-font-smoothing:antialiased;}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}

.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh;}
@media (max-width:1000px){.app{grid-template-columns:1fr;}}
.rail{background:linear-gradient(180deg,#132540 0%,#1B3252 100%);border-right:1px solid #0E1C31;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;}
body.presenting .app{grid-template-columns:minmax(0,1fr);}
body.presenting .rail{position:fixed;left:0;top:0;bottom:0;width:272px;height:100vh;z-index:82;
  transform:translateX(calc(-100% + 14px));transition:transform .22s ease;box-shadow:0 0 40px -10px rgba(10,20,40,.45);}
body.presenting .rail:hover, body.presenting.menu .rail{transform:none;}
body.presenting .rail::after{content:"☰";position:absolute;right:-2px;top:50%;transform:translateY(-50%);
  color:#7E97B8;font-size:13px;}
body.presenting.menu .rail{display:flex;position:fixed;left:0;top:0;bottom:0;width:280px;height:100vh;
  z-index:82;box-shadow:0 0 40px -8px rgba(60,20,40,.3);}
.railveil{position:fixed;inset:0;background:rgba(35,26,30,.42);z-index:81;display:none;}
body.presenting.menu .railveil{display:block;}
.rail-h{padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,.1);}
.raillogo{background:#FFFFFF;border-radius:11px;padding:8px 12px;display:inline-block;}
.raillogo img{height:25px;width:auto;display:block;}
.rail-h .tag{font-size:13px;color:#9FB4CE;margin-top:2px;}
.prog{height:5px;background:rgba(255,255,255,.14);border-radius:99px;margin-top:12px;overflow:hidden;}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#E24B86,#C2185B);border-radius:99px;transition:width .3s;}
.prog-t{font-size:12px;color:#8FA6C2;margin-top:6px;}
.steps{flex:1;overflow-y:auto;padding:10px 10px 16px;}
.snav{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;
  font-family:inherit;cursor:pointer;padding:9px 11px;border-radius:9px;color:#C6D3E4;transition:.13s;}
.snav:hover{background:rgba(255,255,255,.09);color:#FFFFFF;}
.snav.on{background:var(--brand);color:#fff;}
.snav.done .sn{background:#2E7D53;color:#fff;border-color:#2E7D53;}
.snav.off{opacity:.5;}
.snav.off:hover{opacity:.95;}
.snav.on .sn{background:rgba(255,255,255,.22);color:#fff;border-color:transparent;}
.sn{flex:0 0 24px;width:24px;height:24px;border-radius:7px;border:1.5px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:12px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;color:#9FB4CE;}
.st{font-size:14.5px;font-weight:500;line-height:1.4;padding-top:1px;}
.snav.on .st{font-weight:600;}
.sgroup{font-size:11.5px;font-weight:600;letter-spacing:.12em;color:#7E97B8;padding:14px 12px 5px;}
.rail-f{padding:12px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:8px;}
.rail-f .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24);color:#EAF1F8;}
.rail-f .btn:hover{border-color:#E24B86;color:#fff;}
.rail-f .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;}
.rail .logcount,.rail-f .logcount{color:#9FB4CE;}

.btn{font-family:inherit;font-size:14.5px;font-weight:500;cursor:pointer;background:var(--surface);
  color:var(--text-2);border:1.5px solid var(--line-2);border-radius:10px;padding:10px 16px;transition:.14s;}
.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);}
.btn:focus-visible{outline:3px solid var(--brand-line);outline-offset:2px;}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff;}
.btn.lg{font-size:16px;padding:13px 24px;}

.stage{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.mombar{flex:0 0 auto;background:var(--navy-soft);border-bottom:1px solid var(--navy-line);
  padding:7px 44px;display:none;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;}
.mombar.on{display:flex;}
.mombar .ml{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--navy);flex:0 0 auto;}
.mombar .mc{background:#fff;border:1px solid var(--navy-line);border-radius:99px;padding:2px 11px;
  color:var(--navy-d);font-weight:500;}
.mombar .mc.hot{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
@media (max-width:760px){.mombar{padding:6px 16px;font-size:13px;}}
.slide{flex:1;min-height:0;padding:20px 44px 10px;width:100%;display:flex;justify-content:center;
  align-items:flex-start;overflow:hidden;}
.slide.scrolls{overflow-y:auto;}
.slide{background:radial-gradient(1100px 460px at 88% -8%, rgba(194,24,91,.05), transparent 62%),radial-gradient(900px 420px at -6% 106%, rgba(30,58,95,.05), transparent 58%), var(--ground);}
body.warmbg .slide{background:#FBF3E4;}
body.warmbg .punch{background:#FFFDF7;border-color:#EAC8B0;border-left-color:var(--brand);}
body.warmbg figure.shot img{border-color:#EBD9C2;}
body.warmbg .ph{background:#FFFDF7;border-color:#EAD8C0;}
@media (max-width:760px){.slide{padding:18px 16px 10px;}}
.fitbox{width:100%;max-width:1180px;transform-origin:top center;}
.slide-anim{animation:sIn .26s ease-out;}
@keyframes sIn{from{opacity:0;}to{opacity:1;}}
@media (prefers-reduced-motion:reduce){.slide-anim{animation:none;}}

.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--brand);margin-bottom:7px;}
h1.title{font-family:"Gowun Batang",serif;font-weight:700;font-size:44px;line-height:1.18;margin:0 0 7px;
  letter-spacing:-.025em;text-wrap:balance;color:var(--navy-d);}
h1.title b,h1.title .pk-word{color:var(--brand-d);}
@media (max-width:760px){h1.title{font-size:30px;}}
p.lede{font-size:21px;color:var(--text-2);margin:0 0 15px;max-width:60ch;line-height:1.5;}
p.lede b{color:var(--brand-d);font-weight:600;}

.cards{display:grid;gap:12px;margin-bottom:13px;}
.c2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.c3{grid-template-columns:repeat(auto-fit,minmax(225px,1fr));}
.c4{grid-template-columns:repeat(auto-fit,minmax(175px,1fr));}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;box-shadow:var(--shadow);}
.box.hi{border-color:var(--brand-line);box-shadow:var(--shadow-lg);}
.box.soft{background:var(--surface-2);border-color:var(--brand-line);box-shadow:none;}
.box.hi{border-color:var(--brand);border-width:2px;background:var(--brand-soft);}
.box h3{font-size:20px;font-weight:600;margin:0 0 7px;color:var(--navy);letter-spacing:-.01em;}
.box.hi h3{color:var(--brand-d);}
.box p{margin:0 0 6px;font-size:17.5px;color:var(--text-2);line-height:1.5;}
.box p:last-child{margin-bottom:0;}
.box ul{margin:0;padding-left:18px;font-size:17.5px;color:var(--text-2);line-height:1.6;}
.box li{margin-bottom:3px;}
.box li b,.box p b{color:var(--ink);font-weight:600;}
.box .sm{font-size:15.5px;color:var(--text-3);}

figure.shot{margin:0;}
figure.shot img{width:100%;max-height:330px;box-shadow:0 6px 22px -14px rgba(120,20,60,.3);object-fit:cover;border-radius:13px;
  border:1.5px solid var(--line);display:block;}
/* 세로 포스터 — 잘리면 안 되므로 전체가 보이게 */
figure.shot.tall img{max-height:430px;object-fit:contain;background:var(--surface-2);padding:6px;}
/* QR — 작게 */
figure.shot.qr img{max-height:200px;object-fit:contain;background:#fff;padding:6px;}
/* 3칸 갤러리 안에서는 더 낮게 */
.gal.g3 figure.shot img{max-height:270px;}
.gal.g2 figure.shot img{max-height:310px;}
.classgrid{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px;margin-bottom:12px;align-items:center;}
@media (max-width:900px){.classgrid{grid-template-columns:1fr;}}
.classgrid figure.shot.tall img{max-height:460px;}
.classgrid .gal figure.shot img{max-height:215px;}
.gal.g2.big{grid-template-columns:1fr 1fr;gap:14px;}
.gal.g2.big figure.shot img{max-height:640px;object-fit:contain;background:transparent;padding:0;}
.gal.g2.big{align-items:start;}
figure.shot figcaption{font-size:13.5px;color:var(--text-3);margin-top:5px;line-height:1.35;}
.ph{border:2px dashed var(--line-2);border-radius:13px;background:var(--surface-2);min-height:120px;
  display:grid;place-items:center;text-align:center;padding:14px;height:100%;}
.ph .pt{font-size:13.5px;color:var(--text-3);line-height:1.45;}
.ph .pf{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--brand);background:#fff;
  border:1px solid var(--brand-line);border-radius:7px;padding:2px 9px;display:inline-block;margin-top:6px;}
.gal{display:grid;gap:11px;margin-bottom:14px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));}
.gal.g4 figure.shot img{max-height:225px;}
.cmp3{grid-template-columns:repeat(3,1fr);gap:12px;}
.cmp3 figure.shot img{height:250px;max-height:250px;object-fit:cover;}
@media (max-width:900px){.cmp3{grid-template-columns:1fr;}}
.gal.edu4{grid-template-columns:repeat(4,1fr);gap:11px;}
.gal.edu4 figure.shot img{height:360px;max-height:360px;object-fit:cover;}
@media (max-width:900px){.gal.edu4{grid-template-columns:repeat(2,1fr);}}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:center;margin-bottom:13px;}
.split.rev{grid-template-columns:1fr 1.1fr;}
@media (max-width:800px){.split,.split.rev{grid-template-columns:1fr;}}

.stat{text-align:center;padding:18px 12px;}
.stat .v{font-size:44px;font-weight:700;color:var(--brand);line-height:1.05;letter-spacing:-.03em;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
.stat .k{font-size:17px;color:var(--text-2);margin-top:4px;font-weight:500;}
.stat .why{font-size:14.5px;color:var(--text-3);margin-top:3px;line-height:1.4;}
.stat.hero{background:var(--brand);border-color:var(--brand);}
.stat.hero .v,.stat.hero .k{color:#fff;}
.stat.hero .why{color:rgba(255,255,255,.88);}

.grid32{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:13px;}
.areagrid{gap:8px;margin-bottom:0;}
.ringgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:14px;}
@media (max-width:900px){.ringgrid{grid-template-columns:repeat(3,1fr);}}
.ringcell{text-align:center;background:var(--surface);border:1.5px solid var(--line);
  border-radius:14px;padding:15px 8px 13px;box-shadow:var(--shadow);}
.ringc{width:82px;height:82px;margin:0 auto 9px;border-radius:50%;display:grid;place-items:center;
  background:var(--brand-soft);border:3px solid var(--brand-line);color:var(--brand-d);
  font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:700;letter-spacing:-.02em;}
.ringcell.hi{border-color:var(--brand);border-width:2px;background:var(--brand-soft);}
.ringcell.hi .ringc{background:var(--brand);border-color:var(--brand);color:#fff;}
.ringt{font-size:17px;font-weight:700;color:var(--ink);}
.ringd{font-size:14px;color:var(--text-3);margin-top:2px;line-height:1.35;}
.arbox{background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;}
.arn{font-size:17px;font-weight:700;color:var(--brand-d);margin-bottom:2px;}
.ard{font-size:14.5px;color:var(--text-3);line-height:1.35;}
.gradesplit{grid-template-columns:0.6fr 1.4fr;align-items:stretch;}
.brandname{color:var(--brand);font-size:1.15em;}
.gal.g2.compride{align-items:start;}
.gal.g2.compride figure.shot img{width:100%;height:500px;max-height:none;object-fit:contain;background:transparent;}
.compsplit{grid-template-columns:1.75fr 1fr;align-items:center;}
.procsplit{grid-template-columns:0.52fr 1.48fr;align-items:start;}
.procsplit figure.shot img{max-height:600px;}
.pk.way{padding:16px 12px;}
.coverlogo{height:76px;width:auto;margin-bottom:14px;}
.lgtop{font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--navy);opacity:.8;margin-bottom:4px;}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:4px 0 8px;max-width:820px;margin-left:auto;margin-right:auto;}
@media (max-width:760px){.modes{grid-template-columns:1fr;}}
.modecard{background:linear-gradient(180deg,#FFFFFF,#FFFAFC);border:2px solid var(--line-2);border-radius:18px;padding:14px 13px;box-shadow:0 4px 16px -10px rgba(150,25,80,.15);
  text-align:center;cursor:pointer;transition:.15s;font-family:inherit;}
.modecard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(194,24,91,.55);}
.modecard .mn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  background:var(--brand);color:#fff;font-weight:700;font-size:16px;margin-bottom:8px;}
.modecard .mt{display:block;font-size:18.5px;font-weight:700;margin-bottom:5px;color:var(--navy-d);}
.modecard .ms{display:block;font-size:13.5px;color:var(--text-3);line-height:1.4;}
.covermenu{max-width:1020px;margin:10px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:stretch;}
.cms{background:linear-gradient(180deg,#FFFFFF,#FFFAFC);border:2px solid var(--line-2);border-radius:18px;padding:22px 12px 19px;
  cursor:pointer;font-family:inherit;text-align:center;box-shadow:0 5px 18px -10px rgba(150,25,80,.18);transition:.14s;}
.cms:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(194,24,91,.4);}
.cms-t{display:block;font-family:"Gowun Batang",serif;font-size:24px;font-weight:700;color:var(--navy-d);margin-bottom:7px;}
.cms:hover .cms-t{color:var(--brand-d);}
.cms-d{display:block;font-size:13.5px;color:var(--text-3);line-height:1.45;}
.feebar{max-width:900px;margin:0 auto;}
.fb-total{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;text-align:center;padding:14px;font-size:20px;font-weight:700;}
.fb-row{display:grid;grid-template-columns:2.4fr 1fr;gap:4px;margin-top:4px;}
.fb-gov{background:var(--navy-soft);border:2px solid var(--navy-line);border-radius:0 0 0 14px;padding:20px 14px;text-align:center;
  font-size:19px;font-weight:700;color:var(--navy-d);}
.fb-self{background:var(--brand-soft);border:2px solid var(--brand-line);border-radius:0 0 14px 0;padding:20px 14px;text-align:center;
  font-size:19px;font-weight:700;color:var(--brand-d);}
.fb-gov span,.fb-self span{display:block;font-size:13.5px;font-weight:500;color:var(--text-3);margin-top:5px;}
@media (max-width:900px){.covermenu{grid-template-columns:repeat(2,1fr);}}
.caprow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px;}
.datechk{display:flex;gap:9px;align-items:center;font-size:15.5px;color:var(--text-2);cursor:pointer;}
.datechk input{width:19px;height:19px;accent-color:var(--brand);}
.pk.regionpk{padding:13px 6px;border-radius:12px;}
.pk.regionpk .tl2{font-size:17px;}
.capgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.blesspage{min-height:calc(100vh - 170px);display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:0;background:url("images/bless-bg.jpg") center/cover no-repeat;border-radius:24px;}
.bpsmall{font-size:19px;color:var(--text-3);letter-spacing:.14em;margin-bottom:26px;}
.bp1{font-family:"Gowun Batang",serif;font-size:76px;font-weight:700;color:var(--brand-d);line-height:1.28;letter-spacing:-.02em;}
.bp2{font-size:30px;color:var(--navy-d);line-height:1.7;margin-top:26px;}
.bplogo{height:44px;width:auto;margin-top:44px;}
@media (max-width:900px){.bp1{font-size:44px;}.bp2{font-size:22px;}}
.procwide{display:flex;justify-content:center;}
.procwide figure.shot{margin:0;max-width:1050px;width:100%;}
.procwide figure.shot img{max-height:540px;width:100%;object-fit:contain;background:transparent;}
.capcell{border:2px solid var(--line-2);border-radius:14px;padding:13px 10px;text-align:center;background:var(--surface);box-shadow:0 3px 12px -8px rgba(150,25,80,.14);}
.capcell .cb{font-size:14.5px;color:var(--text-3);margin-bottom:4px;}
.capcell .cs{font-size:20px;font-weight:700;}
.capcell .cn{font-size:13px;color:var(--text-3);margin-top:4px;}
.capcell.ok{border-color:#86efac;background:#f0fdf4;} .capcell.ok .cs{color:#15803d;}
.capcell.mid{border-color:#fde047;background:#fefce8;} .capcell.mid .cs{color:#a16207;}
.capcell.full{border-color:#fca5a5;background:#fef2f2;} .capcell.full .cs{color:#b91c1c;}
.capcell.ask{border-color:var(--line-2);} .capcell.ask .cs{color:var(--text-2);}
.capverdict{font-size:21px;font-weight:700;border-radius:13px;padding:13px 16px;margin-bottom:10px;text-align:center;}
.capverdict.ok{background:#f0fdf4;color:#15803d;border:2px solid #86efac;}
.capverdict.mid{background:#fefce8;color:#a16207;border:2px solid #fde047;}
.capverdict.full{background:#fef2f2;color:#b91c1c;border:2px solid #fca5a5;}
.capverdict.ask{background:var(--surface-2);color:var(--text-2);border:2px solid var(--line-2);}
.wkrow{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1.5px solid var(--line-2);border-radius:10px;margin-bottom:6px;background:var(--surface);}
.wkrow b{font-size:16.5px;}
.qjump{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.qjbtn{background:var(--brand-soft);border:1.5px solid var(--brand-line);color:var(--brand-d);
  border-radius:99px;padding:7px 13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.qjbtn:hover{background:var(--brand);color:#fff;}
.qjbtn.on2{background:var(--brand);color:#fff;border-color:var(--brand);}
.smsprev{white-space:pre-wrap;background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:12px;
  padding:13px 15px;font-size:14.5px;line-height:1.55;font-family:inherit;margin:0 0 10px;max-height:300px;overflow-y:auto;}
.hint2{font-size:13.5px;color:var(--text-3);margin-bottom:8px;}
.memobox{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--line-2);}
.memobox .lab{margin-bottom:5px;}
.memobox textarea{width:100%;font-family:inherit;font-size:15px;padding:9px 11px;
  border:1.5px solid var(--line-2);border-radius:10px;resize:vertical;}
.wkrow .wsub{font-size:13.5px;color:var(--text-3);flex:1;}
.capchip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.capchip.ok{background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.capchip.mid{background:#fefce8;color:#a16207;border:1px solid #fde047;}
.capchip.full{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;}
.capchip.ask{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-2);}
.pk.way .em{font-size:30px;margin-bottom:5px;}
.pk.way .tl2{font-size:21px;}
.compsplit figure.shot img{max-height:660px;width:100%;object-fit:contain;}
.whyimg{max-width:1050px;margin:0 auto 12px;}
.whyimg img{border-width:2px;border-color:var(--brand-line);}
figure.shot.fill img{max-height:620px;width:auto;max-width:100%;object-fit:contain;display:block;margin:0 auto;}
@media (max-width:800px){.gradesplit{grid-template-columns:1fr;}}
.flow32 .fstep{position:relative;}
.fnext{position:absolute;right:-17px;top:50%;transform:translateY(-50%);font-size:22px;
  color:var(--brand);font-weight:700;z-index:2;}
@media (max-width:900px){.fnext{display:none;}}
@media (max-width:900px){.grid32{grid-template-columns:repeat(2,1fr);}}
.ladder{display:grid;gap:5px;margin-bottom:13px;}
.ld{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:12px 20px;display:flex;align-items:baseline;gap:14px;}
.ld.on{background:var(--brand-soft);border-color:var(--brand);border-width:2px;}
.lk{font-size:20px;font-weight:700;color:var(--ink);min-width:190px;}
.ld.on .lk{color:var(--brand-d);}
.lv{font-size:18px;color:var(--text-2);}
.ldarr{text-align:center;font-size:19px;color:var(--brand);line-height:1;font-weight:700;}
.ldtag{font-size:14px;background:var(--brand);color:#fff;border-radius:99px;padding:3px 12px;
  vertical-align:3px;font-weight:600;letter-spacing:.02em;}
.punch .txt .hl,.hl{background:linear-gradient(transparent 55%, #FFE08A 55%);padding:0 3px;border-radius:2px;}
@media (max-width:640px){.lk{min-width:auto;}.ld{flex-direction:column;gap:2px;}}
.punch{background:linear-gradient(135deg,#FDF1F6 0%,#FFF8FB 70%);border:2px solid var(--brand-line);border-left:6px solid var(--brand);box-shadow:0 10px 30px -20px rgba(194,24,91,.35);
  border-radius:12px;padding:13px 18px;margin-bottom:13px;}
.punch .lab{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--brand);margin-bottom:3px;}
.punch .txt{font-size:24px;font-weight:600;color:var(--brand-d);line-height:1.42;letter-spacing:-.015em;}
@media (max-width:760px){.punch .txt{font-size:18px;}}

.note{border-radius:12px;padding:14px 18px;margin-bottom:14px;font-size:17.5px;line-height:1.5;
  display:flex;gap:11px;align-items:flex-start;}
.note .ic{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;flex:0 0 auto;}
.note.w{background:var(--warn-soft);border:1.5px solid var(--warn-line);color:var(--warn);}
.note.c{background:var(--crit-soft);border:1.5px solid var(--crit-line);color:var(--crit);}
.note.g{background:var(--good-soft);border:1.5px solid var(--good-line);color:var(--good);}
.note b{font-weight:600;}
.tbd{display:inline-block;font-size:12.5px;font-weight:600;vertical-align:2px;background:var(--warn-soft);
  color:var(--warn);border:1px solid var(--warn-line);border-radius:99px;padding:1px 9px;margin-left:6px;}

.tl{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);margin-bottom:14px;}
.tl-row{display:grid;grid-template-columns:106px 1fr;border-bottom:1px solid var(--line);}
.tl-row:last-child{border-bottom:0;}
.tl-t{background:var(--surface-2);padding:11px 14px;font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:16px;color:var(--brand-d);border-right:1px solid var(--line);}
.tl-b{padding:9px 15px;}
.tag{display:inline-block;font-size:14px;font-weight:600;border-radius:99px;padding:1px 9px;margin:0 5px 3px 0;}
.tag.m{background:#FBE4EE;color:var(--brand-d);}
.tag.b{background:#E2EEFA;color:#0E4E86;}
.tag.h{background:var(--good-soft);color:var(--good);}
.schedwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
@media (max-width:900px){.schedwrap{grid-template-columns:1fr;}}
.sched{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);}
.sc-row{display:grid;grid-template-columns:74px 1fr;border-bottom:1px solid var(--line);}
.sc-row:last-child{border-bottom:0;}
.sc-t{background:var(--brand-soft);padding:9px 6px;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-weight:700;font-size:16.5px;color:var(--brand-d);border-right:1px solid var(--line);}
.sc-b{padding:8px 13px;}
.sc-m{font-size:16.5px;color:var(--ink);line-height:1.4;font-weight:500;}
.sc-s{font-size:14px;color:var(--text-3);margin-top:2px;line-height:1.35;}
.tl-full .tl-row{grid-template-columns:126px 1fr;}
.tl-full .tl-t{font-size:15px;padding:9px 12px;}
.tl-full .tl-b{padding:8px 14px;}
.txt2{font-size:16px;color:var(--text-2);line-height:1.45;}
.tl-sub{font-size:14px;color:var(--text-3);}
.tl-b .txt{font-size:14px;color:var(--text-3);line-height:1.45;}
@media (max-width:620px){.tl-row{grid-template-columns:1fr;}.tl-t{border-right:0;border-bottom:1px solid var(--line);}}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:16px;}
.fstep{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;}
.fstep .n{width:24px;height:24px;border-radius:8px;background:var(--brand);color:#fff;display:grid;
  place-items:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;margin-bottom:7px;}
.fstep h4{margin:0 0 3px;font-size:17px;font-weight:600;}
.fstep p{margin:0;font-size:15px;color:var(--text-2);line-height:1.45;}

.drawer{flex:0 0 auto;background:#0F2038;border-top:2px solid #24405F;max-height:0;overflow:hidden;transition:max-height .25s;}
.drawer.open{max-height:48vh;overflow-y:auto;}
.drawer-in{padding:18px 44px 24px;max-width:1180px;margin:0 auto;}
@media (max-width:760px){.drawer-in{padding:14px 16px 20px;}}
.script{margin-bottom:14px;}
.script h4{margin:0 0 10px;font-size:14px;font-weight:600;letter-spacing:.06em;color:#F2A8C6;
  display:flex;align-items:center;gap:9px;}
.script h4::before{content:"";width:4px;height:14px;background:#F2A8C6;border-radius:2px;}
.script .say{font-size:17px;line-height:1.7;margin:0 0 11px;color:#F4F8FC;}
.script .say::before{content:"“";color:#F2A8C6;font-weight:700;}
.script .say::after{content:"”";color:#F2A8C6;font-weight:700;}
.script .tip{margin-top:13px;padding:12px 15px;background:rgba(242,168,198,.12);border-radius:10px;
  font-size:15px;line-height:1.55;color:#F7DDE7;border:1px solid rgba(242,168,198,.28);}
.script .tip b{color:#FFD3E4;font-weight:600;}
.chk{background:#16304E;border:1.5px solid #2A4A6E;border-radius:14px;padding:16px 20px;}
.chk h4{margin:0 0 9px;font-size:14.5px;font-weight:600;color:#F2A8C6;display:flex;align-items:center;gap:8px;}
.chk h4 .cnt{font-family:"IBM Plex Mono",monospace;font-size:13px;background:rgba(242,168,198,.16);
  border:1px solid rgba(242,168,198,.35);color:#FFD3E4;border-radius:99px;padding:1px 9px;}
.chk label{display:flex;gap:11px;align-items:flex-start;padding:7px 0;cursor:pointer;
  border-bottom:1px dashed #2A4A6E;font-size:15.5px;color:#DCE7F2;line-height:1.5;}
.chk label:last-child{border-bottom:0;}
.chk input{margin-top:3px;width:18px;height:18px;flex:0 0 18px;accent-color:#F2A8C6;cursor:pointer;}
.chk input:checked + span{color:#8A7079;text-decoration:line-through;}

.cover{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#FFFFFF 0%,#FDF1F6 62%,#EEF3F9 100%);
  display:grid;place-items:center;text-align:center;padding:16px;}
.cover.hide{display:none;}
.cover-in{max-width:720px;}
.cover-ph{margin-bottom:10px;}
figure.shot.cover-ph img{max-height:min(195px,20vh);width:min(620px,90%);object-fit:cover;border-radius:20px;box-shadow:0 18px 44px -22px rgba(150,25,80,.4);}
.cover-ph figcaption{display:none;}
.cover .lg{font-family:"Gowun Batang",serif;font-size:35px;font-weight:700;color:var(--brand-d);
  letter-spacing:-.025em;line-height:1.2;}
@media (max-width:640px){.cover .lg{font-size:31px;}}
.cover .sb{font-size:17px;color:var(--text-2);margin-top:8px;line-height:1.5;}
.cover .go{margin-top:30px;font-size:23px;padding:20px 64px;border-radius:16px;box-shadow:0 14px 34px -14px rgba(194,24,91,.5);}
.cover .hint{margin-top:8px;font-size:13.5px;color:var(--text-3);line-height:1.6;}

.areas{display:flex;flex-wrap:wrap;gap:8px;}
.ar{background:var(--navy);color:#fff;border-radius:9px;padding:10px 16px;font-size:17.5px;font-weight:600;}
.qcount{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--brand);font-weight:600;
  background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:99px;padding:2px 11px;
  display:inline-block;margin-bottom:9px;}
.qhead{font-size:21px;font-weight:600;margin:0 0 4px;letter-spacing:-.015em;}
.qhead.big{font-family:"Gowun Batang",serif;font-size:40px;font-weight:700;line-height:1.28;
  margin-bottom:5px;letter-spacing:-.025em;text-wrap:balance;color:var(--navy-d);}
@media (max-width:760px){.qhead.big{font-size:25px;}}
.qsub{font-size:18px;color:var(--text-3);margin:0 0 16px;}
.qsub b{color:var(--brand);font-weight:600;}
.pick{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));margin-bottom:12px;}
.pick.big{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;
  max-width:1150px;margin-left:auto;margin-right:auto;}
.pick.big .pk{padding:30px 16px;}
.pick.n5{grid-template-columns:repeat(5,1fr);}
.pick.n6{grid-template-columns:repeat(3,1fr);}
.pick.n4{grid-template-columns:repeat(4,1fr);}
.pick.n3{grid-template-columns:repeat(3,1fr);}
@media (max-width:900px){.pick.n5,.pick.n6,.pick.n4{grid-template-columns:repeat(2,1fr);}}
.pk{background:linear-gradient(180deg,#FFFFFF 0%,#FFFBFC 100%);border:2px solid var(--line-2);border-radius:18px;padding:22px 14px;box-shadow:0 2px 10px -6px rgba(150,25,80,.12);
  text-align:center;cursor:pointer;transition:.15s;font-family:inherit;}
.pk:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(194,24,91,.55);}
.pk.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 4px rgba(194,24,91,.1);}
.pk .em{font-size:50px;line-height:1;display:block;margin-bottom:11px;}
.pk .tl2{font-size:24px;font-weight:600;display:block;}
.pk .sb{font-size:16px;color:var(--text-3);display:block;margin-top:5px;line-height:1.4;}
.pk.sel .tl2{color:var(--brand-d);}
.pk:focus-visible{outline:3px solid var(--brand-line);outline-offset:3px;}
.pickinfo{font-size:15px;color:var(--text-3);margin:0;}
.pickinfo b{color:var(--brand);font-weight:600;}

.result-card{background:linear-gradient(160deg,#C2185B 0%,#98123F 100%);color:#fff;border-radius:18px;
  padding:26px 30px;margin-bottom:14px;}
.result-card .rl{font-size:14px;font-weight:600;letter-spacing:.08em;opacity:.85;}
.result-card .rt{font-family:"Gowun Batang",serif;font-size:31px;font-weight:700;margin:5px 0 9px;
  line-height:1.25;letter-spacing:-.02em;}
@media (max-width:640px){.result-card .rt{font-size:24px;}}
.result-card .rd{font-size:16.5px;line-height:1.6;opacity:.95;max-width:62ch;}
.result-card .rd b{color:#FFE0EE;font-weight:600;}
.reco{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-top:16px;}
.reco .r{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:13px 15px;}
.reco .r h5{margin:0 0 3px;font-size:14.5px;font-weight:600;color:#fff;}
.reco .r p{margin:0;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.9);}

.chips{display:flex;flex-wrap:wrap;gap:7px;}
.cp{display:inline-block;font-size:16px;padding:5px 13px;border-radius:99px;background:var(--surface-2);
  border:1.5px solid var(--line-2);color:var(--text-2);}
.cp.st{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}

.guess{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px;}
.gk{background:var(--surface);border:2px solid var(--line-2);border-radius:14px;padding:20px 10px;
  text-align:center;cursor:pointer;transition:.16s;font-family:inherit;}
.gk:hover{border-color:var(--brand);transform:translateY(-2px);}
.gk .amt{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:700;letter-spacing:-.02em;}
.gk.picked{border-color:var(--text-3);background:var(--surface-2);}
.gk.answer{border-color:var(--good);background:var(--good-soft);}
.gk.answer .amt{color:var(--good);}
.gk .mk{display:block;font-size:12.5px;font-weight:600;margin-top:5px;}
.gk.picked .mk{color:var(--text-3);}
.gk.answer .mk{color:var(--good);}
.reveal{background:var(--surface);border:2px solid var(--brand);border-radius:16px;padding:22px 28px;
  margin-bottom:14px;text-align:center;}
.reveal .rv-l{font-size:15px;color:var(--text-2);}
.reveal .rv-big{font-family:"IBM Plex Mono",monospace;font-size:48px;font-weight:700;color:var(--brand);
  line-height:1.05;margin:6px 0;letter-spacing:-.03em;}
@media (max-width:640px){.reveal .rv-big{font-size:34px;}}
.reveal .rv-s{font-size:16px;color:var(--text-2);line-height:1.5;}
.reveal .rv-s b{color:var(--brand-d);font-weight:600;}

.quizgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:11px;margin-bottom:12px;}
.quiz{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:13px 16px;}
.quiz .qt{font-size:16px;font-weight:600;margin:0 0 9px;line-height:1.4;}
.quiz .qt span{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--brand);margin-right:7px;}
.ox{display:flex;gap:9px;}
.ox button{flex:1;font-family:inherit;font-size:20px;font-weight:700;padding:8px;border:2px solid var(--line-2);
  border-radius:11px;background:var(--surface);cursor:pointer;color:var(--text-3);transition:.15s;}
.ox button:hover{border-color:var(--brand);color:var(--brand);}
.ox button.right{border-color:var(--good);background:var(--good-soft);color:var(--good);}
.ox button.wrong{border-color:var(--crit);background:var(--crit-soft);color:var(--crit);}
.qans{margin-top:9px;padding:10px 13px;border-radius:10px;font-size:14px;line-height:1.5;}
.qans.o{background:var(--good-soft);border:1.5px solid var(--good-line);color:var(--good);}
.qans.x{background:var(--warn-soft);border:1.5px solid var(--warn-line);color:var(--warn);}
.qans b{font-weight:600;}
.qscore{font-size:16px;font-weight:600;color:var(--brand-d);background:var(--brand-soft);
  border:1.5px solid var(--brand-line);border-radius:12px;padding:12px 17px;margin-bottom:12px;}

.calc{display:grid;grid-template-columns:minmax(0,1fr) 395px;gap:18px;align-items:start;}
@media (max-width:1040px){.calc{grid-template-columns:1fr;}}
.pickrow{display:flex;align-items:center;gap:11px;margin-bottom:8px;}
.pickrow:last-of-type{margin-bottom:0;}
.pl2{flex:0 0 42px;font-size:15px;font-weight:600;color:var(--text-3);}
.pickrow .seg{flex:1;gap:6px;}
.pickrow .seg span{padding:8px 6px;font-size:15px;}
.pickrow .seg span small{font-size:11.5px;}
.pchoose{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:600px){.pchoose{grid-template-columns:1fr;}}
.pchoose label{position:relative;}
.pchoose input{position:absolute;opacity:0;width:0;height:0;}
.pcard{display:block;padding:14px 10px 15px;border:1.5px solid var(--line-2);border-radius:13px;
  background:var(--surface);cursor:pointer;text-align:center;transition:.14s;}
.pcard:hover{border-color:var(--brand-line);background:var(--brand-soft);}
.pchoose input:checked + .pcard{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.pcard .pn{display:block;font-size:14.5px;font-weight:600;color:var(--text-3);}
.pchoose input:checked + .pcard .pn{color:var(--brand);}
.pcard .pd{display:block;font-size:30px;font-weight:700;line-height:1.15;margin-top:2px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:-.02em;}
.pchoose input:checked + .pcard .pd{color:var(--brand);}
.pcard .pf{display:block;font-size:21px;font-weight:600;margin-top:9px;padding-top:9px;
  border-top:1px dashed var(--line-2);}
.pchoose input:checked + .pcard .pf{color:var(--brand-d);}
.pcard .pl{display:block;font-size:11.5px;color:var(--text-3);margin-top:1px;}
.pcard .ps{display:block;font-size:12px;color:var(--text-3);margin-top:4px;}
.resbox{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
.res-h{padding:14px 18px 10px;border-bottom:1px solid var(--line);}
.res-h .code{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;color:var(--brand);}
.res-h .chip{float:right;font-size:12.5px;font-weight:600;background:var(--brand-soft);
  border:1px solid var(--brand-line);color:var(--brand-d);padding:3px 10px;border-radius:99px;}
.res-h .desc{font-size:13.5px;color:var(--text-3);margin-top:5px;clear:both;}
.lines{padding:5px 18px 3px;}
.ln{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);}
.ln:last-child{border-bottom:0;}
.ln .k{font-size:16.5px;color:var(--text-2);}
.ln .k em{display:block;font-style:normal;font-size:12px;color:var(--text-3);margin-top:1px;}
.ln .v{margin-left:auto;font-size:20px;font-weight:600;white-space:nowrap;}
.ln.g .v{color:var(--brand);}
.ln.r .v{color:var(--good);}
.final{margin:6px 16px 10px;padding:14px 18px;border-radius:13px;background:var(--brand);}
.final .cap{font-size:15px;font-weight:600;color:rgba(255,255,255,.92);}
.final .big{font-size:44px;font-weight:700;line-height:1.05;margin-top:3px;color:#fff;letter-spacing:-.03em;}
.final .per{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:5px;}
.verdict{margin:0 16px 12px;padding:13px 16px;border-radius:12px;font-size:14.5px;line-height:1.5;}
.verdict.ok{background:var(--good-soft);border:1.5px solid var(--good-line);color:var(--good);}
.verdict.warn{background:var(--warn-soft);border:1.5px solid var(--warn-line);color:var(--warn);}
.verdict.no{background:var(--crit-soft);border:1.5px solid var(--crit-line);color:var(--crit);}
.verdict .nm{font-size:20px;font-weight:700;display:block;margin-bottom:2px;}
.prepay{margin:0 16px 10px;padding:10px 14px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--brand-line);font-size:14.5px;color:var(--text-2);line-height:1.55;}
.prepay b{color:var(--brand-d);font-weight:600;}

.form{display:grid;gap:12px;margin-bottom:14px;}
.f2{grid-template-columns:repeat(auto-fit,minmax(225px,1fr));}
.f3{grid-template-columns:repeat(2,1fr);gap:8px;}
.seg.mini span{padding:8px 6px;font-size:15px;}

  if (!q.unavailable){
    var d = q.days ? q.days[S.period] : "";
    lines.push("· 기간: " + PNAME[S.period] + (d ? " " + d + "일" : ""));

                  ": 본인부담 " + won(rr.self) + " → 환급 후 " + won(rr.final));
      }

function step(d){
  if (STEPS[cur].render === s_typefinder){
    if (d > 0 && tfIdx < TFQ.length){ tfIdx++; render(); return; }
    if (d < 0 && tfIdx > 0){ tfIdx--; render(); return; }
  }
  var v = visible(), pos = v.indexOf(cur);
  if (pos < 0){
    var cand = (d > 0) ? v.filter(function(i){ return i > cur; })[0]
                       : v.filter(function(i){ return i < cur; }).pop();
    cur = (cand !== undefined) ? cand : v[0];
    render(); return;
  }
  var np = pos + d;
  if (np >= v.length) np = 0;
  else if (np < 0) return;
  cur = v[np]; render();
}

  }
  if (t.name === "period"){ S.period = parseInt(t.value,10); refresh(); }
  if (t.dataset && t.dataset.chk){ checks[t.dataset.chk] = t.checked; refresh(); }
});

      if (v === "none"){ TF.help = (hi >= 0) ? [] : ["none"]; }
      else {
        if (hi >= 0) ha.splice(hi,1); else ha.push(v);
        TF.help = ha.filter(function(x){ return x !== "none"; });
      }
      render(); return;
    }
    if (tf.dataset.multi){
      var arr = TF[k] || [], at = arr.indexOf(v);
      if (at >= 0) arr.splice(at,1);
      else { if (arr.length >= MAXPICK) arr.shift(); arr.push(v); }
      TF[k] = arr;
      if (arr.length >= MAXPICK && tfIdx < TFQ.length) tfIdx++;
    } else { TF[k] = v; if (tfIdx < TFQ.length) tfIdx++; }
    render(); return;
  }
  var qz = e.target.closest("[data-qz]");
  if (qz){ QA_STATE[qz.dataset.qz] = (qz.dataset.qv === "1"); render(); return; }
  var gs = e.target.closest("[data-guess]");
  if (gs){ GUESS = parseInt(gs.dataset.guess,10); render(); return; }
  var fq = e.target.closest(".fq");
  if (fq){ fq.classList.toggle("open"); return; }
  var tb = e.target.closest("[data-tab]");
  if (tb){ faqTab = tb.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(function(x){ x.classList.toggle("on", x === tb); });
    renderFaq(); return; }
});

(function(){
  var x0 = null, y0 = null, sl = document.getElementById("slide");
  sl.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  sl.addEventListener("touchend", function(e){
    if (x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)) return;
    if (e.target.closest("button, input, select, a, label")) return;
    step(dx < 0 ? 1 : -1);
  }, {passive:true});
})();
document.addEventListener("keydown", function(e){
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (e.key === "Escape"){ openFaq(false); openLog(false); menu(false); return; }
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "n" || e.key === "N") document.getElementById("scriptBtn").click();
  else if (e.key === "f" || e.key === "F") openFaq(true);
});
render();
